name: JRM-Renew

on:
  workflow_dispatch:

jobs:
  run_jrm_renew:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 بررسی وجود Secretها
        run: |
          echo "===== بررسی Secretها ====="
          if [ -z "${{ secrets.PRIVATE_REPO_TOKEN }}" ]; then
            echo "❌ Secret PRIVATE_REPO_TOKEN وجود ندارد یا خالی است"
            exit 1
          else
            echo "✅ PRIVATE_REPO_TOKEN پیدا شد"
          fi

          if [ -z "${{ secrets.JUSTRUNMY_ACCOUNT }}" ]; then
            echo "❌ Secret JUSTRUNMY_ACCOUNT وجود ندارد یا خالی است"
            exit 1
          else
            echo "✅ JUSTRUNMY_ACCOUNT پیدا شد"
          fi

      - name: 📥 دانلود اسکریپت از ریپوی خصوصی
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/JRM-Renew-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: 📂 انتقال اسکریپت به پوشه کاری
        run: |
          ls -la private/
          mv private/renew.py renew.py
          ls -la

      - name: 🐍 نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🛡️ راه‌اندازی GOST پروکسی (اختیاری)
        if: ${{ secrets.GOST_PROXY != '' }}
        env:
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
        run: |
          VERSION=$(curl -s https://api.github.com/repos/ginuerzh/gost/releases/latest | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          echo "📦 نسخه GOST: $VERSION"
          wget -q "https://github.com/ginuerzh/gost/releases/download/v${VERSION}/gost_${VERSION}_linux_amd64.tar.gz"
          tar -xzf "gost_${VERSION}_linux_amd64.tar.gz"
          chmod +x gost
          nohup ./gost -L http://:8080 -F "$GOST_PROXY" > gost.log 2>&1 &
          sleep 3
          IP=$(curl -s -x http://127.0.0.1:8080 https://api.ipify.org || echo "failed")
          echo "✅ GOST راه‌اندازی شد - IP خروجی: $IP"

      - name: 🛠️ نصب وابستگی‌های سیستم
        run: |
          sudo apt-get update
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb xvfb x11-utils xdotool scrot
          google-chrome --version

      - name: 🐍 نصب پکیج‌های پایتون
        run: |
          pip install --upgrade pip
          pip install seleniumbase
          seleniumbase install chromedriver

      - name: 🚀 اجرای اسکریپت تمدید
        env:
          PYTHONIOENCODING: utf-8
          JRM_ACCOUNT: ${{ secrets.JUSTRUNMY_ACCOUNT }}
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
          TG_BOT: ${{ secrets.TG_BOT }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python renew.py

      - name: 📸 آپلود اسکرین‌شات‌ها (در صورت وجود)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
          if-no-files-found: ignore
